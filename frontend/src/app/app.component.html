<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/">User management</a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
    @if (auth.signedIn()) {
      @if (auth.role() === 'Admin') {
        <a routerLink="/users" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Directory</a>
        <a routerLink="/users/new" routerLinkActive="active" ariaCurrentWhenActive="page">New account</a>
      }
      <button class="button ghost" type="button" (click)="auth.logout()">Sign out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Sign in</a>
    }
  </nav>
</header>
<main id="main-content" tabindex="-1" class="content">
  <p class="notification" role="status" aria-live="polite">{{ notifications.message() }}</p>
  <router-outlet />
</main>
<footer class="site-footer">Organization account workspace · Authorized access only</footer>
